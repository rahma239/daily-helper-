<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyHelper — Your Little Helper, Every Day</title>
<style>
:root{--pink:#f7b8cf;--lav:#cfc5f6;--cream:#fffaf2;--ink:#51485b;--muted:#8b8194;--white:#fff;--line:#f0e6ef;--shadow:0 12px 35px #8c6b8b18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff5f8,#f7f3ff 55%,#fffaf0);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 14px;background:#f5d4e1;color:#634c5a;font-weight:650}button:hover{filter:brightness(.97)}.app{max-width:1100px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px}.date{background:#fff9;border:1px solid var(--line);padding:9px 14px;border-radius:14px}.hero{background:linear-gradient(115deg,#f9d8e5,#e7e0fb);padding:24px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:20px}.hero h2{margin:0 0 5px;font-size:23px}.hero p{margin:0;color:#76697e}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.nav,.panel,.tile{background:#ffffffd9;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.nav{padding:12px;height:max-content}.nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent}.nav button.active,.nav button:hover{background:#f9e4ed}.content{min-width:0}.panel{padding:20px;min-height:440px}.panel h2{margin:0 0 5px;font-size:21px}.hint{color:var(--muted);margin:0 0 18px;font-size:13px}.formrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{padding:11px 12px;border:1px solid #e9dce9;border-radius:12px;background:#fff;color:var(--ink);min-width:0}.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff}.task .info{flex:1;min-width:0}.task small{display:block;color:var(--muted)}.task.done .name{text-decoration:line-through;color:#a49aa8}.task input[type=checkbox]{width:18px;height:18px;accent-color:#d88eae}.small{font-size:12px;padding:7px 9px}.calendar{background:#f1eaff;color:#65558a}.danger{background:#fce5e7;color:#9d5962}.empty{padding:25px;text-align:center;color:var(--muted);background:#fff9;border:1px dashed #e8d9e8;border-radius:15px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:16px}.tile b{display:block;margin-bottom:5px}.tile span{color:var(--muted);font-size:13px}.result{margin-top:12px;padding:12px;background:#f8f3ff;border-radius:12px;min-height:42px}.muted{color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.date{display:none}.panel{padding:16px}.task{flex-wrap:wrap}.task .info{min-width:60%}}@media(max-width:420px){.tiles{grid-template-columns:1fr}.formrow>*{width:100%}.task button{flex:1}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">🌷</div><div><h1>DailyHelper</h1><div class="sub">Your Little Helper, Every Day.</div></div></div><div class="date" id="today"></div></header>
<section class="hero"><h2>Hai, selamat datang! ✨</h2><p>Atur hari, kelola ide, dan belajar hal baru dalam satu tempat.</p></section>
<div class="layout"><nav class="nav" aria-label="Menu"><button class="active" data-page="planner">🗓️ Daily Planner</button><button data-page="calculator">🧮 Smart Calculator</button><button data-page="money">💰 Money Manager</button><button data-page="ideas">💡 Idea Helper</button><button data-page="learn">📚 Learning Corner</button></nav><section class="content"><div class="panel" id="view"></div></section></div>
</main>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);const view=$('#view');let tasks=load('dh_tasks',[]),transactions=load('dh_money',[]);
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}function save(){try{localStorage.setItem('dh_tasks',JSON.stringify(tasks));localStorage.setItem('dh_money',JSON.stringify(transactions))}catch(e){}}
const today=new Date();$('#today').textContent=today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='planner')planner();if(name==='calculator')calculator();if(name==='money')money();if(name==='ideas')ideas();if(name==='learn')learn()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));
function planner(){view.innerHTML=`<h2>Daily Planner 🌸</h2><p class="hint">Susun kegiatanmu dan tambahkan acara ke Google Kalender.</p><form class="formrow" id="taskForm"><input class="field" id="taskName" placeholder="Nama kegiatan..." required style="flex:2"><input class="field" id="taskDate" type="date" required><input class="field" id="taskTime" type="time" value="09:00" required><button type="submit">＋ Tambah</button></form><div id="taskList"></div>`;$('#taskDate').value=new Date().toISOString().slice(0,10);$('#taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#taskName').value.trim();if(!name)return;tasks.push({id:Date.now(),name,date:$('#taskDate').value,time:$('#taskTime').value,done:false});save();planner()});renderTasks()}
function renderTasks(){const el=$('#taskList');if(!el)return;if(!tasks.length){el.innerHTML='<div class="empty">Belum ada kegiatan. Tambahkan rencana pertamamu yuk! 💗</div>';return}el.innerHTML=tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div class="info"><b class="name">${safe(t.name)}</b><small>${safe(t.date)} · ${safe(t.time)}</small></div><button class="small calendar" data-cal="${t.id}">＋ Google Kalender</button><button class="small danger" data-del="${t.id}">Hapus</button></div>`).join('');el.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',()=>{const t=tasks.find(t=>t.id==x.dataset.check);if(t)t.done=x.checked;save();planner()}));el.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!=x.dataset.del);save();planner()}));el.querySelectorAll('[data-cal]').forEach(x=>x.addEventListener('click',()=>{const t=tasks.find(t=>t.id==x.dataset.cal);if(!t)return;const start=t.date.replaceAll('-','')+'T'+t.time.replace(':','')+'00';const d=new Date(t.date+'T'+t.time+':00');d.setHours(d.getHours()+1);const end=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.name)+'&dates='+start+'/'+end+'&details='+encodeURIComponent('Dibuat dari DailyHelper');window.open(url,'_blank','noopener,noreferrer')}))}
function calculator(){view.innerHTML=`<h2>Smart Calculator 🧮</h2><p class="hint">Hitung operasi matematika atau diskon belanja.</p><div class="formrow"><input class="field" id="expr" placeholder="Contoh: (25 + 5) * 2" style="flex:1"><button id="calcBtn">Hitung</button></div><div class="result" id="calcResult">Hasil akan muncul di sini.</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><b>Kalkulator diskon</b><div class="formrow" style="margin-top:10px"><input class="field" id="price" type="number" min="0" placeholder="Harga awal"><input class="field" id="discount" type="number" min="0" max="100" placeholder="Diskon %"><button id="discountBtn">Hitung</button></div><div class="result" id="discountResult">Masukkan harga dan diskon.</div>`;$('#calcBtn').onclick=()=>{try{$('#calcResult').textContent='Hasil: '+evaluate($('#expr').value)}catch(e){$('#calcResult').textContent='Periksa kembali rumusnya.'}};$('#discountBtn').onclick=()=>{let p=Number($('#price').value),d=Number($('#discount').value);$('#discountResult').textContent=($('#price').value===''||$('#discount').value===''||p<0||d<0||d>100)?'Masukkan angka valid (diskon 0–100%).':'Harga setelah diskon: '+(p*(1-d/100)).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}}
function evaluate(s){if(!s.trim()||!/^[\d+\-*/().\s]+$/.test(s))throw Error();let i=0;function ws(){while(/\s/.test(s[i]||'')&&i<s.length)i++}function atom(){ws();if(s[i]==='+'||s[i]==='-'){let op=s[i++],v=atom();return op==='-'?-v:v}if(s[i]==='('){i++;let v=add();ws();if(s[i++]!==')')throw Error();return v}let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)/);if(!m)throw Error();i+=m[0].length;return Number(m[0])}function mul(){let v=atom();for(;;){ws();let op=s[i];if(op!=='*'&&op!=='/')break;i++;let n=atom();v=op==='*'?v*n:v/n}return v}function add(){let v=mul();for(;;){ws();let op=s[i];if(op!=='+'&&op!=='-')break;i++;let n=mul();v=op==='+'?v+n:v-n}return v}let out=add();ws();if(i!==s.length||!Number.isFinite(out))throw Error();return out}
function money(){let income=transactions.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0),expense=transactions.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0);view.innerHTML=`<h2>Money Manager 💰</h2><p class="hint">Catat pemasukan dan pengeluaran sederhana di perangkat ini.</p><div class="tiles"><div class="tile"><span>Pemasukan</span><b>${fmt(income)}</b></div><div class="tile"><span>Pengeluaran</span><b>${fmt(expense)}</b></div><div class="tile"><span>Saldo</span><b>${fmt(income-expense)}</b></div></div><form class="formrow" id="moneyForm" style="margin-top:18px"><select class="field" id="mType"><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select><input class="field" id="mNote" placeholder="Keterangan" required style="flex:1"><input class="field" id="mAmount" type="number" min="1" placeholder="Jumlah Rp" required><button>＋ Simpan</button></form><div class="formrow" style="margin-top:14px"><button type="button" id="emailRecap">✉️ Kirim Rekap via Email</button><button type="button" id="notesRecap">📝 Simpan ke Catatan</button></div><div id="moneyList"></div><p class="hint">Privasi: catatan hanya tersimpan di browser/perangkat ini. Jangan masukkan PIN atau kata sandi.</p>`;$('#moneyForm').onsubmit=e=>{e.preventDefault();transactions.push({id:Date.now(),type:$('#mType').value,note:$('#mNote').value.trim(),amount:Number($('#mAmount').value),date:new Date().toISOString().slice(0,10)});save();money()};$('#moneyList').innerHTML=transactions.length?transactions.slice().reverse().map(t=>`<div class="task"><div class="info"><b>${safe(t.note)}</b><small>${t.type==='in'?'Pemasukan':'Pengeluaran'}</small></div><b>${t.type==='in'?'+':'−'}${fmt(t.amount)}</b><button class="small danger" data-md="${t.id}">Hapus</button></div>`).join(''):'<div class="empty">Belum ada catatan transaksi.</div>';$('#moneyList').querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{transactions=transactions.filter(t=>t.id!=b.dataset.md);save();money()});$('#emailRecap').onclick=()=>{if(!transactions.length){alert('Belum ada transaksi untuk direkap.');return}const inc=transactions.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0),out=transactions.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0);const lines=transactions.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>`${t.date||'Tanggal tidak dicatat'} | ${t.type==='in'?'Pemasukan':'Pengeluaran'} | ${t.note} | ${t.type==='in'?'+':'-'}${fmt(t.amount)}`);const subject='Rekap Keuangan DailyHelper';const body=['REKAP KEUANGAN DAILYHELPER','',`Tanggal dibuat: ${new Date().toLocaleDateString('id-ID')}`,'',`Total pemasukan: ${fmt(inc)}`,`Total pengeluaran: ${fmt(out)}`,`Saldo akhir: ${fmt(inc-out)}`,'','RINCIAN TRANSAKSI',...lines,'','Dibuat menggunakan DailyHelper.'].join('\n');window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}}
function fmt(n){return n.toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}
function ideas(){view.innerHTML=`<h2>Idea Helper 💡</h2><p class="hint">Pilih kebutuhan untuk mendapatkan inspirasi awal.</p><div class="formrow"><select class="field" id="ideaType"><option value="konten">Ide konten media sosial</option><option value="belajar">Rencana belajar</option><option value="bisnis">Ide bisnis kecil</option><option value="routine">Rutinitas harian</option><option value="keluarga">Aktivitas keluarga</option></select><button id="ideaBtn">Beri aku ide ✨</button></div><div class="result" id="ideaResult">Inspirasi sederhana akan muncul di sini.</div>`;const ideaset={konten:['Buat video 3 fakta unik dalam 20 detik.','Bagikan tutorial singkat dengan langkah 1–2–3.','Ceritakan proses di balik karya atau kegiatanmu.'],belajar:['Belajar 25 menit, istirahat 5 menit, lalu ulangi.','Buat 5 kartu ringkasan dari materi hari ini.','Ajarkan kembali satu konsep dengan bahasamu sendiri.'],bisnis:['Buka pre-order camilan buatan rumah.','Tawarkan jasa desain poster sederhana.','Buat paket hadiah kecil sesuai momen.'],routine:['Mulai pagi dengan merapikan tempat tidur.','Tulis tiga prioritas utama hari ini.','Sisihkan 10 menit untuk merapikan ruang.'],keluarga:['Masak satu menu bersama.','Jalan santai sore tanpa gawai.','Buat malam permainan tebak kata.']};$('#ideaBtn').onclick=()=>{let a=ideaset[$('#ideaType').value];$('#ideaResult').textContent=a[Math.floor(Math.random()*a.length)]}}
function learn(){view.innerHTML=`<h2>Learning Corner 📚</h2><p class="hint">Pilih satu topik untuk mulai belajar sedikit demi sedikit.</p><div class="tiles">${[['Literasi digital','Kenali jejak digital dan jaga privasi online.'],['Desain digital','Pelajari komposisi, warna, dan tipografi.'],['Keuangan dasar','Bedakan kebutuhan, keinginan, dan tabungan.'],['Komunikasi','Latih mendengar aktif dan berbicara jelas.'],['AI untuk pemula','Gunakan AI sebagai alat bantu, cek hasilnya.'],['Kebiasaan belajar','Buat target kecil dan evaluasi rutin.']].map(x=>`<div class="tile"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`}

page('planner');
})();
</script></body></html>
